<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- Magpie Tunnel menu-bar glyph, shared outline with the app icon:
       a magpie perched on a tunnel portal, its tail threading the opening.
       Healthy: the tail runs unbroken from the bird down to the baseline. -->
  <path d="M 11 34 L 11 21 A 7 7 0 0 1 25 21 L 25 34"
        fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Bird: body, head, short wedge beak -->
  <ellipse cx="17.8" cy="10.6" rx="4.8" ry="3.5" transform="rotate(-24 17.8 10.6)" fill="#000"/>
  <circle cx="23.4" cy="6.2" r="2.5" fill="#000"/>
  <path d="M 25.2 5.1 L 29.6 3.7 L 25.9 7.2 Z" fill="#000"/>

  <!-- Tail: one continuous feather through the portal -->
  <path d="M 18.4 12.4 L 16.6 34 L 19.7 34 L 20.9 13 Z" fill="#000"/>
</svg>

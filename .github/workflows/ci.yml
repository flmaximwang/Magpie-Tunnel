name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Swift tests + app bundles
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Run tests
        run: swift test

      - name: Build .app bundles
        run: ./scripts/build-apps.sh

      - name: Verify bundles
        run: |
          test -x 'dist/Magpie Web 隧道.app/Contents/MacOS/magpie-web-tunnel'
          test -x 'dist/Magpie Tunnel Status.app/Contents/MacOS/MagpieTunnelStatus'
          codesign --verify --deep 'dist/Magpie Web 隧道.app'
          codesign --verify --deep 'dist/Magpie Tunnel Status.app'
          plutil -lint 'dist/Magpie Web 隧道.app/Contents/Info.plist'
          plutil -lint 'dist/Magpie Tunnel Status.app/Contents/Info.plist'
